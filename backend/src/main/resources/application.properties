spring.application.name=backend

# Base de datos MySQL. Las credenciales se toman del entorno para no versionarlas.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tudia?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Origen autorizado para consumir la API desde el frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Usuario inicial para desarrollo. En producción, establecer SEED_ENABLED=false.
app.seed.enabled=${SEED_ENABLED:true}
app.seed.usuario.username=${SEED_USERNAME:nicko}
app.seed.usuario.nombre=${SEED_NOMBRE:Nicolas Velasquez}
app.seed.usuario.correo=${SEED_CORREO:admin@gmai.com}
app.seed.usuario.contrasena=${SEED_PASSWORD:asdasdasd}

# Archivos de portada subidos desde el editor.
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
